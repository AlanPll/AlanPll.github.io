name: Actualités maths
on:
  schedule:
    - cron: "17 5 * * *"   # tous les jours vers 7h (heure de Paris)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_actualites.py
      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/actualites_maths.json
          git diff --cached --quiet || (git commit -m "Mise à jour des actualités maths" && git push)

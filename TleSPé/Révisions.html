<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 30px;
      background-color: #f5f5f5;
    }

    .portrait {
      display: flex;
      align-items: center;
      gap: 15px;
      justify-content: center;
    }

    .portrait img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #333;
    }

    .infos h1 {
      margin: 0;
      font-size: 24px;
    }

    .infos p {
      margin: 5px 0 0;
      color: #555;
    }

    .boutons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 80px 0;
    }

    .boutons a {
      display: inline-block;
      padding: 15px 32px;
      font-size: 16px;
      text-decoration: none;
      border-radius: 6px;
      background-color: #5C5B58;
      color: white;
    }

    .boutons a:hover {
      background-color: #555;
    }

    .complements {
      max-width: 600px;
      margin: 0 auto;
      background-color: white;
      padding: 20px;
      border-radius: 8px;
    }

    .complements h2 {
      margin-top: 0;
    }
  </style>
</head>

<body>

  <header class="portrait">
    <img src="./assets/img/brelrevisions.png" alt="Portrait">
    <div class="infos">
       <h1>Jacques Brel</h1>
      <p>1929 -- 1978</p>
    </div>
  </header>
  <main>
    
    <section class="boutons">
      <a href="LivretLectureGraphiquev7_1.pdf">Livret de lecture graphique</a>
    </section>

    
  </main>
  
</body>
</html>
